name: Bug report
description: Report incorrect behavior in RaceML
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, private datasets, or security vulnerabilities. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a small reproducible example using synthetic or public data.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RaceML version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, CPU, RAM, backend and backend version.
    validations:
      required: true
