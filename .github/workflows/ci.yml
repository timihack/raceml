name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format
        run: uv run --locked ruff format --check src/ tests/

      - name: Type check
        run: uv run --locked mypy src/raceml tests/integration/test_core_contracts.py

      - name: Test
        run: uv run --locked pytest

      - name: Build source distribution and wheel
        run: uv build --no-sources

      - name: Verify artifacts and isolated installations
        env:
          RACEML_DIST_DIR: dist
        run: uv run --locked pytest tests/integration/test_packaging.py
